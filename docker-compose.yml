

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: green_mantenimientos_app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: green_secret_2026
      REFRESH_SECRET: green_refresh_secret_2026
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: green_user
      DB_PASSWORD: green_password
      DB_NAME: green_mantenimientos
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: green_mantenimientos_postgres
    environment:
      POSTGRES_USER: green_user
      POSTGRES_PASSWORD: green_password
      POSTGRES_DB: green_mantenimientos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: green_mantenimientos_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
